[project]
name = "pycastle"
dynamic = ["version"]
description = "Python orchestrator for autonomous Claude Code agents in Docker"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click",
    "docker",
    "platformdirs",
    "python-dotenv",
    "rich",
    "ruhken-agent-runtime>=0.2.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff>=0.16",
    "setuptools>=68",
    "setuptools-scm>=8",
    "time-machine",
    'tzdata; platform_system == "Windows"',
    "types-docker",
]

[project.scripts]
pycastle = "pycastle.main:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycastle", "pycastle.*"]

[tool.setuptools.package-data]
pycastle = [
    "py.typed",
    "defaults/.gitignore",
    "defaults/config.py",
    "defaults/Dockerfile",
    "defaults/prompts/coordination/diverge.md",
    "defaults/prompts/coordination/merge.md",
    "defaults/prompts/coordination/plan.md",
    "defaults/prompts/coordination/_expected-output-shape-diverge.md",
    "defaults/prompts/coordination/_expected-output-shape-merge.md",
    "defaults/prompts/coordination/_expected-output-shape-plan.md",
    "defaults/prompts/diagnostics/failure-report.md",
    "defaults/prompts/diagnostics/host-check-issue.md",
    "defaults/prompts/diagnostics/preflight-issue.md",
    "defaults/prompts/diagnostics/_expected-output-shape-failure-report.md",
    "defaults/prompts/diagnostics/_expected-output-shape-host-check-issue.md",
    "defaults/prompts/diagnostics/_expected-output-shape-preflight-issue.md",
    "defaults/prompts/improve/01-scan.md",
    "defaults/prompts/improve/02-prd.md",
    "defaults/prompts/improve/03-issues.md",
    "defaults/prompts/improve/04-no-candidate-report.md",
    "defaults/prompts/improve/_expected-output-shape-01-scan.md",
    "defaults/prompts/improve/_expected-output-shape-02-prd.md",
    "defaults/prompts/improve/_expected-output-shape-03-issues.md",
    "defaults/prompts/shared/_issue-tracker.md",
    "defaults/prompts/shared/_placeholder-info.md",
    "defaults/prompts/shared/resume.md",
    "defaults/prompts/shared/standards/_design.md",
    "defaults/prompts/shared/standards/_implementation.md",
    "defaults/prompts/work/_output-rules.md",
    "defaults/prompts/work/_shared-instructions.md",
    "defaults/prompts/work/_expected-output-shape-behavior.md",
    "defaults/prompts/work/_expected-output-shape-implementation.md",
    "defaults/prompts/work/behavior.md",
    "defaults/prompts/work/docs.md",
    "defaults/prompts/work/refactor.md",
    "defaults/prompts/work/review.md",
    "defaults/setup/cron-install.sh",
    "defaults/setup/cron-uninstall.sh",
    "defaults/setup/cron.sh",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Docker daemon and the pycastle image",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── permanent rejections (see ADR 0052) ──────────────────────────────────
    "D",       # docstrings: mandated docstrings degrade into signature restatements
    "COM",     # trailing comma: fights ruff format (ruff docs say so explicitly)
    "E501",    # line length: ruff format owns line width; re-reports formatter decisions
    "TRY003",  # exception-message: pushes toward custom exception per message; contradicts ADR 0048
    "TRY004",  # type-check-error: domain failures use RuntimeError not TypeError — see ADR 0052
    "EM101",   # string-in-exception: same pressure as TRY003, rejected with it
    "EM102",   # f-string-in-exception: same pressure as TRY003, rejected with it
    "PLR09",   # numeric-thresholds: arbitrary; C901 is the better-calibrated alternative
    "CPY001",  # copyright: repository has LICENSE; per-file headers add nothing
    # ── backlog (drain one entry per ticket) ─────────────────────────────────
    # complexity
    "C901",     # complex-structure (architecture work required)
    # private access
    "SLF001",   # private-member-access (architecture work required)
]

[tool.ruff.lint.per-file-ignores]
# PLC0415 — deferred imports justified by circular cycles or startup-performance / robustness
"src/pycastle/bug_reporter.py" = ["PLC0415"]                      # try/except deferred imports for robustness
"src/pycastle/main.py" = ["PLC0415"]                              # lazy CLI submodule loading
"src/pycastle/orchestration.py" = ["PLC0415"]                     # thin entry-point; defers heavy orchestrator load
"src/pycastle/run_lock.py" = ["PLC0415"]                          # platform-conditional (msvcrt / fcntl)
"src/pycastle/runtime_session.py" = ["PLC0415"]                   # cycle: session.service_session_store → runtime_session
"src/pycastle/session_planning.py" = ["PLC0415"]                  # robustness: agent_runtime may not be installed
"src/pycastle/commands/host_check_run.py" = ["PLC0415"]           # lazy imports required for test-mock patchability at pycastle.agents.runner
"src/pycastle/commands/init.py" = ["PLC0415"]                     # lazy CLI submodule loading
"src/pycastle/infrastructure/shutdown_hook.py" = ["PLC0415"]      # deferred urllib3 import for startup performance
"src/pycastle/iteration/__init__.py" = ["PLC0415"]                # cycle: hard_agent_error_report → iteration
"src/pycastle/iteration/preflight.py" = ["PLC0415"]              # lazy import required for test-mock patchability at pycastle.infrastructure.worktree
"src/pycastle/prompts/pipeline.py" = ["PLC0415"]                  # cycle: scope_args → pipeline
"src/pycastle/prompts/scope_args.py" = ["PLC0415"]               # cycle: dispatch → scope_args → implement → ... → agents.runner → dispatch
"src/pycastle/services/__init__.py" = ["PLC0415"]                 # __getattr__ lazy-load pattern for startup performance
"src/pycastle/services/runtime_services.py" = ["PLC0415"]         # cycle: session.agent → session_planning → runtime_services
"src/pycastle/session/service_session_store.py" = ["PLC0415"]     # cycle: session.role → service_session_store
"tests/**" = [
    "PLC0415", # import-outside-toplevel (test fixtures and lazy test helpers use local imports intentionally)
    "S101",    # assert
    "ANN",     # annotation
    "S108",    # hardcoded-temp-path
    "S105",    # hardcoded-secret (hardcoded-password-string)
    "S106",    # hardcoded-secret (hardcoded-password-func-arg)
    "DTZ",     # naive-datetime
    "ARG",     # unused-argument
    "PLR2004", # magic-value
    "FBT",     # boolean-trap (test helpers may use positional booleans)
    "S603",    # subprocess-path (subprocess-without-shell-equals-true)
    "S607",    # subprocess-path (start-process-with-partial-path)
    "S102",    # exec (tests validate generated config by executing it)
    "S107",    # hardcoded-password-default (test factory sentinel tokens are not real secrets)
    "PYI034",  # __enter__ return type (test fakes intentionally return narrower types than Self)
    "SIM115",  # open-file-with-context-handler (open() held for fcntl.flock lifetime; with-block would release lock immediately)
    "PTH123",  # pathlib-open (same sites as SIM115; Path.open() would close the handle on exit)
    "ASYNC221", # blocking-process-invocation-in-async-function (sync subprocess.run in async test helpers is intentional; tests avoid real async git plumbing)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = false
