[project]
name = "pycastle"
dynamic = ["version"]
description = "Python orchestrator for autonomous Claude Code agents in Docker"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click",
    "docker",
    "platformdirs",
    "python-dotenv",
    "rich",
    "ruhken-agent-runtime>=0.2.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff>=0.16,<0.17",
    "setuptools>=68",
    "setuptools-scm>=8",
    "time-machine",
    'tzdata; platform_system == "Windows"',
    "types-docker",
]

[project.scripts]
pycastle = "pycastle.main:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycastle", "pycastle.*"]

[tool.setuptools.package-data]
pycastle = [
    "py.typed",
    "defaults/.gitignore",
    "defaults/config.py",
    "defaults/Dockerfile",
    "defaults/prompts/coordination/diverge.md",
    "defaults/prompts/coordination/merge.md",
    "defaults/prompts/coordination/plan.md",
    "defaults/prompts/coordination/_expected-output-shape-diverge.md",
    "defaults/prompts/coordination/_expected-output-shape-merge.md",
    "defaults/prompts/coordination/_expected-output-shape-plan.md",
    "defaults/prompts/diagnostics/failure-report.md",
    "defaults/prompts/diagnostics/host-check-issue.md",
    "defaults/prompts/diagnostics/preflight-issue.md",
    "defaults/prompts/diagnostics/_expected-output-shape-failure-report.md",
    "defaults/prompts/diagnostics/_expected-output-shape-host-check-issue.md",
    "defaults/prompts/diagnostics/_expected-output-shape-preflight-issue.md",
    "defaults/prompts/improve/01-scan.md",
    "defaults/prompts/improve/02-prd.md",
    "defaults/prompts/improve/03-issues.md",
    "defaults/prompts/improve/04-no-candidate-report.md",
    "defaults/prompts/improve/_expected-output-shape-01-scan.md",
    "defaults/prompts/improve/_expected-output-shape-02-prd.md",
    "defaults/prompts/improve/_expected-output-shape-03-issues.md",
    "defaults/prompts/shared/_issue-tracker.md",
    "defaults/prompts/shared/_placeholder-info.md",
    "defaults/prompts/shared/resume.md",
    "defaults/prompts/shared/standards/_design.md",
    "defaults/prompts/shared/standards/_implementation.md",
    "defaults/prompts/work/_output-rules.md",
    "defaults/prompts/work/_shared-instructions.md",
    "defaults/prompts/work/_expected-output-shape-behavior.md",
    "defaults/prompts/work/_expected-output-shape-implementation.md",
    "defaults/prompts/work/behavior.md",
    "defaults/prompts/work/docs.md",
    "defaults/prompts/work/refactor.md",
    "defaults/prompts/work/review.md",
    "defaults/setup/cron-install.sh",
    "defaults/setup/cron-uninstall.sh",
    "defaults/setup/cron.sh",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Docker daemon and the pycastle image",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ── permanent rejections (see ADR 0052) ──────────────────────────────────
    "D",       # docstrings: mandated docstrings degrade into signature restatements
    "COM",     # trailing comma: fights ruff format (ruff docs say so explicitly)
    "E501",    # line length: ruff format owns line width; re-reports formatter decisions
    "TRY003",  # exception-message: pushes toward custom exception per message; contradicts ADR 0048
    "EM101",   # string-in-exception: same pressure as TRY003, rejected with it
    "EM102",   # f-string-in-exception: same pressure as TRY003, rejected with it
    "PLR09",   # numeric-thresholds: arbitrary; C901 is the better-calibrated alternative
    "CPY001",  # copyright: repository has LICENSE; per-file headers add nothing
    # ── backlog (drain one entry per ticket) ─────────────────────────────────
    # imports
    "PLC0415",  # import-outside-toplevel (545 findings)
    # simplify / modernise
    "SIM105",   # suppressible-exception (10 findings)
    "SIM102",   # collapsible-if (5 findings)
    "SIM115",   # open-file-with-context-handler (1 finding)
    # pyupgrade
    "UP040",    # non-pep695-type-alias (19 findings)
    "UP042",    # replace-str-enum (3 findings)
    "UP046",    # non-pep695-generic-class (1 finding)
    # exceptions / try
    "BLE001",   # blind-exception (38 findings)
    "TRY300",   # try-consider-else (8 findings)
    "TRY301",   # raise-within-try (2 findings)
    "TRY201",   # verbose-raise (1 finding)
    "S110",     # try-except-pass (8 findings)
    # annotations
    "ANN401",   # dynamically-typed-expression (36 findings)
    "ANN001",   # missing-type-function-argument (24 findings)
    "ANN201",   # missing-return-type-public-function (8 findings)
    "ANN202",   # missing-return-type-private-function (7 findings)
    "ANN204",   # missing-return-type-special-method (1 finding)
    "ANN002",   # missing-type-args (1 finding)
    # booleans
    "FBT001",   # boolean-typed-positional-argument (23 findings)
    "FBT002",   # boolean-default-positional-argument (8 findings)
    "FBT003",   # boolean-positional-value-in-call (4 findings)
    # complexity
    "C901",     # complex-structure (22 findings)
    # magic values / private access
    "PLR2004",  # magic-value-comparison (20 findings, src/ only)
    "SLF001",   # private-member-access (19 findings)
    # subprocess
    "S603",     # subprocess-without-shell-equals-true (5 findings, src/ only)
    "S602",     # subprocess-popen-with-shell-equals-true (1 finding)
    # assert / print
    "S101",     # assert (17 findings, src/ only)
    "T201",     # print (26 findings)
    # strings / f-strings
    "FLY002",   # static-join-to-fstring (18 findings)
    "ISC004",   # unnecessary-escaped-quote (15 findings)
    "RUF005",   # collection-literal-concatenation (5 findings)
    "RUF003",   # ambiguous-unicode-character-comment (2 findings)
    # return / control flow
    "RET504",   # unnecessary-assign (2 findings)
    "RET503",   # implicit-return (1 finding)
    # pathlib
    "PTH123",   # pathlib (10 findings)
    "PTH101",   # pathlib (2 findings)
    "PTH108",   # pathlib (1 finding)
    # async
    "ASYNC221", # blocking-subprocess-in-async-function (11 findings)
    "ASYNC240", # blocking-dns-lookup (3 findings)
    "ASYNC251", # blocking-sleep-in-async-function (1 finding)
    "ASYNC110", # blocking-busy-wait (1 finding)
    # ruff-specific
    "RUF012",   # mutable-class-attributes (3 findings)
    # loops / builtins
    "B010",     # do-not-call-setattr-with-constant (3 findings; setattr used intentionally to bypass mypy on untyped attrs)
    "B905",     # zip-without-explicit-strict (2 findings)
    "B008",     # function-call-in-default-argument (1 finding)
    # raise
    "RSE102",   # unnecessary-paren-on-raise-exception (7 findings)
    # pep695 / typing
    "PYI034",   # non-self-return-type (3 findings)
    # pylint misc
    "ARG002",   # unused-method-argument (12 findings, src/ only)
    "ARG001",   # unused-function-argument (6 findings, src/ only)
    # performance
    "PERF401",  # manual-list-comprehension (2 findings)
    # futurize
    "FURB177",  # int-on-slice-len (6 findings)
    "FURB192",  # sorted-min-max (2 findings)
    # misc
    "PIE810",   # single-starts-ends-with (1 finding)
    "N806",     # non-lowercase-variable-in-function (1 finding)
    "EXE001",   # shebang-not-executable (1 finding)
    "S310",     # suspicious-url-open-usage (2 findings)
    "S102",     # use-of-exec (2 findings)
    "S107",     # hardcoded-password-default (1 finding)
    "S105",     # hardcoded-password-string (1 finding, src/ only)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert
    "ANN",     # annotation
    "S108",    # hardcoded-temp-path
    "S105",    # hardcoded-secret (hardcoded-password-string)
    "S106",    # hardcoded-secret (hardcoded-password-func-arg)
    "DTZ",     # naive-datetime
    "ARG",     # unused-argument
    "PLR2004", # magic-value
    "S603",    # subprocess-path (subprocess-without-shell-equals-true)
    "S607",    # subprocess-path (start-process-with-partial-path)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = false
